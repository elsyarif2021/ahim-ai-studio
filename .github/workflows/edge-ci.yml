name: AHIM Cloudflare Edge checks

on:
  push:
    branches:
      - feat/cloudflare-edge-backend-20261121
    paths:
      - 'edge/**'
      - '.github/workflows/edge-ci.yml'
  pull_request:
    paths:
      - 'edge/**'
      - '.github/workflows/edge-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: edge
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Install dependencies (staging only)
        run: npm install --no-audit --no-fund
      - name: Syntax check
        run: npm run check
      - name: Runtime unit tests (D1/KV/R2)
        run: npm test
      - name: Wrangler dry run (never deploy)
        run: npm run build
