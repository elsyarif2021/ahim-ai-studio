name: AHIM Prompt Kilat Studio checks
on:
  push:
    branches:
      - feat/unified-prompt-kilat-studio-20261121
  pull_request:
    branches:
      - main
jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check JavaScript syntax
        run: npm run check
      - name: Run unit tests
        run: npm test
